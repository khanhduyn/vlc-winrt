name: Build VLC WinRT UWP (x64)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-uwp:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Stage LibVLC binaries
        shell: powershell
        run: |
          nuget install VideoLAN.LibVLC.UWP -Version 3.3.2 -ExcludeVersion -OutputDirectory tools
          $targetDir = "libvlc\Universal\vlc-amd64\Release"
          New-Item -ItemType Directory -Force -Path $targetDir
          New-Item -ItemType Directory -Force -Path "$targetDir\include"

          $src = "tools\VideoLAN.LibVLC.UWP\build\win10-x64"
          Copy-Item "$src\libvlc.dll" "$targetDir\"
          Copy-Item "$src\libvlccore.dll" "$targetDir\"
          Copy-Item -Recurse -Force "$src\plugins" "$targetDir\"
          Copy-Item -Recurse -Force "$src\sdk\include\*" "$targetDir\include\"
          Copy-Item "$src\sdk\lib\libvlc.lib" "$targetDir\"
          Copy-Item "$src\sdk\lib\libvlccore.lib" "$targetDir\"
          New-Item -ItemType Directory -Force -Path "$targetDir\plugins\access"

      - name: Detect latest Windows UAP SDK
        shell: powershell
        run: |
          $uapRoot = "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP"
          $sdkVersion = (Get-ChildItem -Directory $uapRoot | Sort-Object Name -Descending | Select-Object -First 1).Name
          Write-Host "Detected UAP SDK: $sdkVersion"
          "UAP_SDK_VERSION=$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate temporary signing certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=716F2E5E-A03A-486B-BC67-9B18474B9D51" -KeyUsage DigitalSignature -FriendlyName "VLC Test Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "Passw0rd123!" -Force -AsPlainText
          $pfxPath = "$env:GITHUB_WORKSPACE\app\VLC.Universal\VLC_WinRT.Universal_TemporaryKey.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\TrustedPeople" -Password $password

      - name: Restore NuGet packages
        shell: powershell
        run: |
          msbuild app\VLC.Universal\VLC.Universal.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /p:TargetPlatformVersion="$env:UAP_SDK_VERSION"

      - name: Build UWP Sideload Package (x64 Release)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\AppPackages"
          msbuild app\VLC.Universal\VLC.Universal.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:TargetPlatformVersion="$env:UAP_SDK_VERSION" `
            /p:WindowsTargetPlatformVersion="$env:UAP_SDK_VERSION" `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms="x64" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="VLC_WinRT.Universal_TemporaryKey.pfx" `
            /p:PackageCertificatePassword="Passw0rd123!" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE/AppPackages/" `
            /v:normal `
            /fl /flp:logfile=msbuild.log;verbosity=normal

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log
          path: msbuild.log
          if-no-files-found: ignore

      - name: Upload AppPackages artifact
        uses: actions/upload-artifact@v4
        with:
          name: VLC-WinRT-x64-AppPackages
          path: AppPackages/
